<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<HTML><HEAD><TITLE>JavaScript Timer Coverage</TITLE>
<SCRIPT LANGUAGE="JavaScript">
var ticks=0;
function writeMark(id,msg){var d=document.getElementById(id);if(d)d.innerHTML=msg;}
function timerOne(){ticks++;writeMark("timer1","timer 1 fired #"+ticks);}
function timerTwo(){writeMark("timer2","timer 2 fired after timer 1 was registered");}
function timerThrow(){throw "timer-borne boom";}
function timerLateWrite(){document.write('<P ID="late"><B>LATE-WRITE:</B> document.write from setTimeout executed.</P>');}
</SCRIPT></HEAD>
<BODY BGCOLOR="#FFFFCC">
<H1>JavaScript Timer Coverage</H1>
<P ID="timer1">timer 1 pending</P>
<P ID="timer2">timer 2 pending</P>
<P ID="throwStatus">throw timer pending</P>
<SCRIPT LANGUAGE="JavaScript">
setTimeout("timerOne()", 200);
setTimeout("timerTwo()", 400);
setTimeout("timerThrow()", 600);
setTimeout("writeMark('throwStatus','timer throw completed; browser continued running')", 800);
setTimeout("timerLateWrite()", 1000);
</SCRIPT>
<P>Static text after timers. A later document.write test intentionally probes post-parse write behavior.</P>
</BODY></HTML>
