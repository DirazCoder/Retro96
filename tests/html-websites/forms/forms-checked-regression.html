<!doctype html>
<html>
<head><title>Checked Property Regression</title></head>
<body>
<h2>Checked property regression</h2>
<p>Before clicking the controls, checked=false is expected. After clicking, each clicked control must report checked=true.</p>
<input type="radio" name="r" id="r1" value="one" onclick="show('r1','r1 checked='+document.getElementById('r1').checked)"> Radio one
<input type="radio" name="r" id="r2" value="two" onclick="show('r2','r2 checked='+document.getElementById('r2').checked)"> Radio two
<br>
<input type="checkbox" id="cb" value="yes" onclick="show('cb','cb checked='+document.getElementById('cb').checked)"> Check me
<div id="out"></div>
<script>
function show(id,msg){ document.getElementById('out').innerHTML = msg; }
</script>
</body>
</html>
