<!-- ============================================================
     frames.html -- Retro96 QA suite (task 4-c2, frames + 1996 pages)
     Frameset document.  The outer rows split plus the nested cols split
     exercise BOTH division axes in one document at 800x600.
     Checks exercised:
     FR-01  outer frameset rows="80,*": banner strip 800x80 on top,
            remainder 800x520 below
     FR-02  nested frameset cols="30%,*": nav column 240 wide and
            main column 560 wide (rows-then-cols nesting)
     FR-03  three named frames: name="banner" / "nav" / "main"
     FR-04  banner frame scrolling="no" -- scrollbars must never appear
     FR-05  banner frame noresize -- border is not user-draggable
     FR-06  marginwidth / marginheight on the frames
     FR-07  border / frameborder / framespacing on both framesets
            (Netscape 3 border rendering)
     FR-08  <noframes> fallback = a full alternative page body that
            must be completely invisible when frames are supported
     FR-09  links inside frames-nav.html target="main" (named-frame
            navigation -- see the sub-document headers)
     ============================================================ -->
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2 Final//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>Retro96 Frames Test -- frames.html</title>
</head>

<frameset rows="80,*" border=2 frameborder=1 framespacing=2>
  <frame src="frames-banner.html" name="banner" scrolling="no" noresize marginwidth=0 marginheight=0>
  <frameset cols="30%,*" border=2 frameborder=1 framespacing=2>
    <frame src="frames-nav.html" name="nav" scrolling="auto" marginwidth=4 marginheight=4>
    <frame src="frames-main.html" name="main" scrolling="yes">
  </frameset>
</frameset>

<noframes>
<body bgcolor="#FFFFFF" text="#000000" link="#0000EE" vlink="#551A8B" alink="#FF0000">
<h1>Retro96 Frames Test (no-frames version)</h1>
<p>You are seeing the &lt;noframes&gt; fallback of frames.html: either
this browser does not support frames, or frames are switched off.  When
frames ARE supported, this entire body must stay invisible.</p>
<hr>
<p>The three frame sub-documents can still be opened directly:</p>
<ul>
<li><a href="frames-banner.html">frames-banner.html</a> -- top banner, scrolling disabled</li>
<li><a href="frames-nav.html">frames-nav.html</a> -- left navigation column (30 percent)</li>
<li><a href="frames-main.html">frames-main.html</a> -- main content, contains an iframe</li>
</ul>
<hr>
<p><font size=2>Expected geometry at 800x600: banner 800x80, nav 240x520,
main 560x520.</font></p>
</body>
</noframes>

</html>
